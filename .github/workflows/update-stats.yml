name: Update Worker Stats
on:
  schedule:
    - cron: '0 */1 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      # ✅ 新增：从 gh-pages 分支恢复旧的 data.json
      - name: Restore data.json from gh-pages
        run: |
          git fetch origin gh-pages
          git checkout origin/gh-pages -- data.json && mv data.json public/data.json || echo "No existing data.json found, starting fresh"

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Fetch Data from Cloudflare
        run: node scripts/fetch-data.js
        env:
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CF_ZONE_ID }}

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          cname: workers-usage.265209.xyz
